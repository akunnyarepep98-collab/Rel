<!DOCTYPE html>
<html>
<head>
    <title>Login Hotspot SMK KARTANEGA Wates</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        .login-box img {
            width: 80px;
            margin-bottom: 15px;
        }

        h2 {
            margin: 10px 0;
            color: #333;
        }

        input[type=text],
        input[type=password] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type=submit] {
            width: 100%;
            padding: 10px;
            background: #2c5364;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type=submit]:hover {
            background: #203a43;
        }

        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="login-box">
    <!-- Ganti logo.png dengan file logo sekolah -->
    <img src="logo.png" alt="Logo SMK KARTANEGA Wates">

    <h2>SMK KARTANEGA Wates</h2>
    <p>Login Hotspot</p>

    <form action="$(link-login-only)" method="post">
        <input type="hidden" name="dst" value="$(link-orig)">
        <input type="hidden" name="popup" value="true">

        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <input type="submit" value="Login">
    </form>

    <div class="footer">
        Dibuat oleh Farel
    </div>
</div>

</body>
</html>
